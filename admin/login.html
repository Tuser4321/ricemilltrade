<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Rice Mill Trade</title>
  <link rel="icon" type="image/png" href="../assets/images/brand/logo.png">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%);
      padding: 20px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      padding: 38px 32px;
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 5px;
      background: linear-gradient(to right, #0f3460, #e67e22);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-brand img {
      max-height: 55px;
      margin: 0 auto 10px auto;
      object-fit: contain;
    }
    .login-brand h2 {
      font-size: 1.45rem;
      color: #0f3460;
      font-weight: 800;
    }
    .login-brand p {
      font-size: 0.85rem;
      color: #64748b;
    }
    .hint-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.82rem;
      color: #475569;
      margin-bottom: 20px;
    }
    .hint-box strong {
      color: #0f3460;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <img src="../assets/images/brand/logo.png" alt="Rice Mill Trade">
      <h2>Rice Mill Trade <span>Admin</span></h2>
      <p>ওয়েবসাইট কন্ট্রোল ও ম্যানেজমেন্ট প্যানেল</p>
    </div>

    <div class="hint-box">
      <strong>ডিফল্ট লগইন ইউজার ও পাসওয়ার্ড:</strong><br>
      • ইউজার: <code>admin</code> | পাসওয়ার্ড: <code>Rezaul9270</code> (Superadmin)<br>
      • ইউজার: <code>amirul</code> | পাসওয়ার্ড: <code>Amirul2026</code> (Admin)<br>
      • ইউজার: <code>helal</code> | পাসওয়ার্ড: <code>Helal2026</code> (Manager)
    </div>

    <form id="loginForm">
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" style="display:block; font-weight:700; font-size:0.88rem; margin-bottom:6px;">ইউজারনেম (Username)</label>
        <input type="text" id="username" class="form-control" placeholder="admin" required style="width:100%; padding:11px 14px; border:1.5px solid #cbd5e1; border-radius:6px;">
      </div>

      <div class="form-group" style="margin-bottom: 22px;">
        <label class="form-label" style="display:block; font-weight:700; font-size:0.88rem; margin-bottom:6px;">পাসওয়ার্ড (Password)</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required style="width:100%; padding:11px 14px; border:1.5px solid #cbd5e1; border-radius:6px;">
      </div>

      <div id="loginError" style="display:none; color:#dc2626; background:#fef2f2; padding:10px; border-radius:6px; font-size:0.85rem; margin-bottom:16px;"></div>

      <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; font-size:1rem; font-weight:700; background:#0f3460; color:#fff; border:none; border-radius:6px; cursor:pointer;">
        লগইন করুন (Secure Sign In)
      </button>

      <div style="text-align:center; margin-top:18px;">
        <a href="../index.html" style="font-size:0.85rem; color:#64748b; text-decoration:none;">← মূল ওয়েবসাইটে ফিরে যান</a>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const errBox = document.getElementById('loginError');

      // Load admin list from localStorage or data/site.json
      let admins = [
        { username: "admin", password: "Rezaul9270", name: "Rezaul Karim", role: "superadmin" },
        { username: "amirul", password: "Amirul2026", name: "MD. Amirul Islam", role: "admin" },
        { username: "helal", password: "Helal2026", name: "Md. Helal Miah", role: "manager" }
      ];

      const customAdmins = localStorage.getItem('rmt_custom_admins');
      if (customAdmins) {
        try {
          admins = JSON.parse(customAdmins);
        } catch (e) {}
      } else {
        try {
          const res = await fetch('../data/site.json');
          const data = await res.json();
          if (data && data.admins && data.admins.length > 0) {
            admins = data.admins;
          }
        } catch (err) {}
      }

      const found = admins.find(a => a.username.toLowerCase() === u.toLowerCase() && a.password === p);

      if (found) {
        localStorage.setItem('rmt_admin_session', JSON.stringify({
          username: found.username,
          name: found.name || found.username,
          role: found.role || 'admin',
          loginTime: new Date().toISOString()
        }));
        window.location.href = 'dashboard.html';
      } else {
        errBox.style.display = 'block';
        errBox.textContent = 'ভুল ইউজারনেম অথবা পাসওয়ার্ড! দয়া করে সঠিক তথ্য দিন।';
      }
    });
  </script>
</body>
</html>
