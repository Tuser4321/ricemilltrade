<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Rice Mill Trade</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <h2>🌾 Rice Mill Trade</h2>
      <p>অ্যাডমিন প্যানেলে লগইন করুন</p>
    </div>
    <div id="loginAlert" class="alert alert-danger" style="display: none; color: #ef4444; margin-bottom: 15px; font-size: 0.9rem;"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">ইউজারনাম / Username</label>
        <input type="text" id="username" class="form-control" placeholder="ইউজারনাম লিখুন" required value="admin">
      </div>
      <div class="form-group">
        <label for="password">পাসওয়ার্ড / Password</label>
        <input type="password" id="password" class="form-control" placeholder="পাসওয়ার্ড লিখুন" required value="Rezaul9270">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="width:100%;">লগইন করুন</button>
    </form>
    <div class="login-footer" style="margin-top: 20px; font-size: 0.85rem; color: #64748b; text-align: center;">
      <p>ডিফল্ট ইউজার: <code>admin</code> | পাসওয়ার্ড: <code>Rezaul9270</code></p>
    </div>
  </div>
  <script src="js/admin.js"></script>
</body>
</html>
